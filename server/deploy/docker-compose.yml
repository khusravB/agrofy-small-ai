# AGROFY SMS на VPS: сервер + Caddy (автоматический HTTPS от Let's Encrypt).
# Запуск из папки server/deploy:  docker compose up -d --build
services:
  agrofy:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      AGROFY_PUBLIC_URL: https://${AGROFY_DOMAIN}
    volumes:
      - agrofy-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    environment:
      AGROFY_DOMAIN: ${AGROFY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - agrofy
    restart: unless-stopped

  # Своя языковая модель для /ВОПРОС (необязательно):
  #   docker compose --profile llm up -d
  # и в .env: AGROFY_LLM_PROVIDER=local. Модель (~1 ГБ) скачивается один раз
  # с Hugging Face в том llm-models. Порт наружу не открыт: модель видна
  # только SMS-серверу.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11977
    profiles: ["llm"]
    command:
      - -hf
      - ${AGROFY_LLM_HF:-Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "4096"
      - --threads
      - "2"
      - --parallel
      - "1"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm-models:/models
    restart: unless-stopped

volumes:
  agrofy-data:
  caddy-data:
  llm-models:
